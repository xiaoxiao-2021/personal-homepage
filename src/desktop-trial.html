<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人首页 · 桌面试验</title><style>
:root{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#2e302d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}.card{height:100%;padding:18px;border-radius:20px;border:1px solid rgba(255,255,255,.78);background:rgba(255,253,247,.86);backdrop-filter:blur(20px) saturate(1.14);box-shadow:0 14px 44px rgba(42,45,39,.2);display:flex;flex-direction:column;user-select:none}.title{display:flex;align-items:center;gap:8px;font-size:13px;cursor:move;-webkit-app-region:drag}.pill{margin-left:auto;color:#587261;background:#e6eee8;border-radius:999px;padding:4px 8px;font-size:10px;-webkit-app-region:no-drag}.time{font-size:30px;font-weight:550;letter-spacing:.02em;margin-top:17px}.date{font-size:12px;color:#72766f;margin-top:3px}.rule{height:1px;background:#e3e0d8;margin:15px 0}.label{color:#777a73;font-size:11px;letter-spacing:.08em}.demo{margin-top:8px;padding:11px;border-radius:12px;background:rgba(255,255,255,.62);font-size:13px}.foot{margin-top:auto;display:flex;gap:8px;justify-content:flex-end}.button{border:1px solid #dedcd3;background:rgba(255,255,255,.76);border-radius:10px;padding:8px 10px;font:12px inherit;color:#41443e;cursor:pointer}.button.primary{background:#547265;color:white;border-color:#547265}#state{font-size:10px;color:#777a73;margin-right:auto;align-self:center}.button:focus{outline:2px solid #547265}
</style></head><body><main class="card"><div class="title">⌂ 个人首页 <span class="pill">桌面试验 · 示例内容</span></div><div class="time" id="time">--:--</div><div class="date" id="date"></div><div class="rule"></div><div class="label">演示入口</div><div class="demo">✦ 这是一张独立桌面卡片，不含真实任务或个人资料。</div><div class="foot"><span id="state">桌面层连接中…</span><button class="button" id="home">普通首页</button><button class="button primary" id="exit">退出试验</button></div></main><script>
function tick(){const now=new Date();document.querySelector('#time').textContent=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});document.querySelector('#date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,15000);document.querySelector('#exit').onclick=()=>window.trialApi.exit();document.querySelector('#home').onclick=()=>window.trialApi.home();window.trialApi.onAttached((status)=>{if(status&&status.ok)document.querySelector('#state').textContent='桌面绑定已核验';});
</script></body></html>
