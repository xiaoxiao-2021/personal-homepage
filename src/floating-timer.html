<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>悬浮专注</title><link rel="stylesheet" href="floating-timer.css"></head><body><header><span id="phase">专注这一刻</span><button id="ambient" title="打开白噪音与视频小窗" aria-label="打开白噪音与视频小窗"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 14v-3a7 7 0 0 1 14 0v3"/><rect x="3" y="12" width="4" height="7" rx="2"/><rect x="17" y="12" width="4" height="7" rx="2"/></svg></button><button id="close" title="收起悬浮窗，计时继续" aria-label="收起悬浮窗，计时继续"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><p id="task">正在读取任务…</p><main><strong id="time">--:--</strong><button id="toggle" disabled>暂停</button><button id="home" title="返回个人首页" aria-label="返回个人首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 11 8-7 8 7v9H4Z"/><path d="M9 20v-7h6v7"/></svg></button></main><nav id="wrapup" hidden aria-label="专注结束后的选择"><button id="complete">任务完成</button><button id="again">再专注</button><button id="rest">休息一下</button></nav><footer id="status" role="status">拖动上方可移动 · 收起后计时继续</footer><script src="floating-timer.js"></script></body></html>
