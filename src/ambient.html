<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src home-ambient:; frame-src https://player.bilibili.com"><title>声音小窗 · 一点雨声</title><link rel="stylesheet" href="ambient.css"></head>
<body><header><span class="brand">◌ 一点雨声</span><div class="window-buttons"><span id="quickControls" hidden><button id="quickPlay" type="button">播放</button><button id="quickMute" type="button" aria-pressed="false">静音</button><button id="quickFavorites" type="button" popovertarget="quickList" aria-expanded="false">收藏</button></span><button id="expandPanel" hidden title="展开设置 · Esc" aria-label="展开声音设置">展开</button><button id="top" aria-label="窗口置顶" aria-pressed="true" title="窗口置顶">置顶</button><button id="hide" aria-label="收起小窗，声音继续" title="收起小窗，声音继续">×</button></div></header>
<div id="quickList" popover aria-label="快捷收藏列表"></div><div id="recovery" hidden><button id="retry" type="button">重试当前视频</button><button id="retryExternal" type="button">浏览器打开</button></div><p id="quickStatus" role="status" hidden></p>
<main><div class="scene" id="scene"><div id="landscape" aria-hidden="true"><div class="sun"></div><div class="hill far"></div><div class="hill near"></div><div class="rain"></div></div><iframe id="biliPlayer" title="B站官方视频播放器" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe><audio id="localAudio" preload="metadata" loop></audio><video id="video" muted loop playsinline preload="metadata" hidden disablepictureinpicture></video><div class="scene-caption" id="caption">给眼前的事，留一点安静。</div></div>
<div class="source-row"><label for="sourceMode">声音来源</label><select id="sourceMode"><option value="local">本地音频 / 视频原声</option><option value="bili">B 站视频原声</option><option value="synth">内置合成声</option></select></div><div id="biliControls" hidden><div class="bili-input"><input id="biliLink" type="text" maxlength="2000" placeholder="B 站完整视频链接或 BV 号" aria-label="B站视频链接"><button id="biliLoad">载入</button></div><div class="favorite-row"><select id="favoriteSelect" aria-label="收藏的B站链接"><option value="">暂无收藏</option></select><button id="favoritePlay" type="button" disabled>播放</button><button id="favoriteAdd" type="button">☆ 收藏</button><button id="favoriteRemove" type="button" disabled title="移除所选收藏">移除</button></div><button id="videoOnly" type="button" disabled title="只保留视频画面">纯视频</button><button id="biliExternal" type="button">在浏览器打开</button></div><div class="heading"><div><h1>声音小窗</h1><p id="description">选一段你喜欢的声音，陪你慢慢来。</p></div><span id="badge">未播放</span></div>
<div class="sounds" id="synthSounds" hidden role="group" aria-label="选择环境声"><button data-sound="rain" aria-pressed="true">雨落窗边</button><button data-sound="white" aria-pressed="false">柔和白噪</button><button data-sound="wind" aria-pressed="false">远处风声</button></div>
<div class="play-row"><button id="play" class="primary" aria-pressed="false">开始聆听</button><label>音量<input id="volume" type="range" min="0" max="1" step="0.01" value="0.25" aria-label="白噪音音量"></label><output id="level" for="volume">25%</output></div>
<div class="video-row"><button id="choose">＋ 选择音频 / 视频</button><button id="clear" hidden>移除画面</button><span id="sourceHint">播放原声</span></div>
<details id="focusOptions"><summary>专注时的声音</summary><label><input type="checkbox" id="focusStart"> 开始专注时播放所选收藏</label><label><input type="checkbox" id="focusEnd"> 本轮专注结束时暂停声音</label></details><p id="status" role="status">选择本地素材，或切换到 B 站粘贴视频链接。</p></main><dialog id="favoriteDialog" aria-labelledby="favoriteHeading"><form id="favoriteForm"><h2 id="favoriteHeading">给这段声音起个名字</h2><input id="favoriteName" maxlength="60" aria-label="收藏名称" placeholder="例如：窗边雨声"><p id="favoriteStatus" role="status"></p><div><button id="favoriteCancel" type="button">取消</button><button id="favoriteSave" class="primary" type="submit">保存收藏</button></div></form></dialog><script src="ambient-sound.js"></script><script src="ambient.js"></script></body></html>
